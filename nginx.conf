# nginx — BASH-Site quick reference / fallback config
# For full production config see security/config/nginx-bash-site.conf

# Разместить: /etc/nginx/sites-available/bash-site.conf
# Активировать: ln -s /etc/nginx/sites-available/bash-site.conf /etc/nginx/sites-enabled/
# Проверка: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name bash-site.ru www.bash-site.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bash-site.ru www.bash-site.ru;

    root /var/www/bash-site/public;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/bash-site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bash-site.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (simplified)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
