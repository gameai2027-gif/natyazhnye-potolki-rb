# ============================================================================
# nginx — SkyLine production server block
# Домен: skyline-bashkortostan.ru
# Разместить: /etc/nginx/sites-available/skyline.conf
# Активировать: ln -s /etc/nginx/sites-available/skyline.conf /etc/nginx/sites-enabled/
# Проверка: nginx -t && systemctl reload nginx
# ============================================================================

# --- Лимиты (защита от brute-force / DDoS на форму) ---
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Upstream к PHP-FPM (если используется локальный PHP для /api/) ---
upstream php_backend {
    server unix:/run/php/php8.2-fpm.sock;
    # или server 127.0.0.1:9000;
}

# --- HTTP -> HTTPS редирект (порт 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name skyline-bashkortostan.ru www.skyline-bashkortostan.ru;

    # ACME-challenge для Let's Encrypt (до редиректа!)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS основной сервер (TLS 1.3 / 1.2) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skyline-bashkortostan.ru www.skyline-bashkortostan.ru;

    root /var/www/skyline/public;
    index index.html skyline-2026.html;

    charset utf-8;
    server_tokens off;            # скрыть версию nginx

    # --- www -> non-www ---
    if ($host = www.skyline-bashkortostan.ru) {
        return 301 https://skyline-bashkortostan.ru$request_uri;
    }

    # --- TLS сертификаты (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/skyline-bashkortostan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyline-bashkortostan.ru/privkey.pem;

    # --- TLS 1.3 + 1.2 (минимум), запрет legacy ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- OCSP stapling ---
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # --- Security Headers ---
    # HSTS с preload (только после включения в hstspreload.org!)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self https://yandex.ru), camera=(), microphone=(), display-capture=(), fullscreen=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # --- Content-Security-Policy (мягкий вариант для статичного лендинга) ---
    # Для strict-варианта с nonce см. /security/config/nginx-skyline.conf
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.telegram.org; frame-src https://yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    # --- Размеры тела запроса ---
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --- Gzip сжатие ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        font/woff2;

    # --- Статика — длинный кэш + immutable ---
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Переопределяем security headers для статики
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # --- HTML — короткий кэш ---
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # --- Защита скрытых файлов (.git, .env, .htaccess и т.д.) ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Запрет выполнения PHP вне /api/ ---
    location ~ \.php$ {
        deny all;
    }

    # --- /api/lead — точка приёма формы (rate-limit) ---
    location = /api/lead {
        limit_req zone=lead_limit burst=3 nodelay;
        limit_conn conn_limit 5;
        rewrite ^/api/lead$ /api/lead.php last;
    }
    location ^~ /api/ {
        limit_req zone=lead_limit burst=3 nodelay;
        limit_conn conn_limit 5;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php_backend;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_hide_header X-Powered-By;
        }
    }

    # --- well-known ---
    location = /.well-known/security.txt {
        default_type text/plain;
    }
    location = /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # --- robots.txt / sitemap.xml ---
    location = /robots.txt  { default_type text/plain; }
    location = /sitemap.xml { default_type application/xml; }

    # --- Запрет методов кроме GET/HEAD/POST ---
    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 405;
    }

    # --- Кастомные страницы ошибок (без трассировки) ---
    error_page 400 401 402 403 404 405 /err.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /500.html;
    location = /err.html { internal; }
    location = /429.html { internal; }
    location = /500.html { internal; }

    # --- Главная ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
