<!-- ═════ JSON-LD: FAQPage (8 вопросов) ═════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"Запах от ПВХ будет после монтажа? У нас аллергик.","acceptedAnswer":{"@type":"Answer","text":"От полотна MSD или Pongs запах минимальный и выветривается за 2–4 часа. Греем электрической пушкой Bosch с термоконтролем 70 °C ±3 °C, не газовой — нагрев бережный. Резкий химический запах неделю и дольше — признак дешёвого полотна с пластификаторами. Мы с такими фабриками не работаем. Если запах не выветрится за сутки — приедем и заменим по гарантии."}},
    {"@type":"Question","name":"Затопили соседи. Что делать с полотном?","acceptedAnswer":{"@type":"Answer","text":"Полотно ПВХ держит до 100 литров воды на 1 м². Не сливайте сами — позвоните 8-919-144-28-23. Приедем в течение 24 часов, сольём воду через технологическое отверстие, просушим полотно и установим обратно. Если деформировалось — заменим по гарантии."}},
    {"@type":"Question","name":"Реальный срок службы потолка?","acceptedAnswer":{"@type":"Answer","text":"Заводская гарантия MSD, Pongs и Descor — 15 лет на полотно и 5 лет на монтаж. За 12 лет работы к нам обращались по гарантии 19 раз — всё закрыли бесплатно. Полотно не должно провисать, желтеть, терять цвет. Если что-то не так — пункт 8.3 договора: выезжаем в течение 5 рабочих дней."}},
    {"@type":"Question","name":"Вы выезжаете в отдалённые сёла Иглинского района?","acceptedAnswer":{"@type":"Answer","text":"Работаем по 12 сёлам Иглинского района: Иглино, Уктеево, Кальтово, Ашман, Урман-Иглин, Тауш, Чуваш-Кубово, Улу-Теляк, Орловка, Загорское, Аскин, Чишма. Выезд бесплатно. В отдалённые районы Башкортостана (Инзер, Толпарово) — по графику раз в неделю."}},
    {"@type":"Question","name":"Обои уже поклеены. Можно ставить потолок?","acceptedAnswer":{"@type":"Answer","text":"Да. Пушка Bosch греет воздух до 70 °C, обои от этого не отвалятся — они держатся до 110 °C. Главное — за час до монтажа закрыть мебель плёнкой и убрать вещи с верхней полки шкафов. Уборку делаем сами, мусор выносим. Если обои виниловые на тонком бетоне — лучше укрепить угол, скажем на замере."}},
    {"@type":"Question","name":"Можно ли демонтировать и поставить заново через 3 года?","acceptedAnswer":{"@type":"Answer","text":"Да, если полотно не повреждено. Снимаем за 40 минут, аккуратно складываем. Ставим обратно с новым багетом — 2 500 ₽ за комнату 18 м². Если полотно пожелтело — лучше заменить, повторный монтаж снимает только часть стоимости."}},
    {"@type":"Question","name":"Пожаробезопасны ли натяжные потолки?","acceptedAnswer":{"@type":"Answer","text":"Все полотна MSD, Pongs и Descor, с которыми мы работаем, — группа горючести Г1 (слабогорючие), дымообразование Д2, токсичность Т2. Сертификаты МЧС прикладываем к договору. Такие потолки ставят в детских садах и кафе — требования пожарных выполнены. Дешёвые полотна Г3–Г4 мы не используем."}},
    {"@type":"Question","name":"Почему дороже, чем мастер с авито за 300 ₽/м²?","acceptedAnswer":{"@type":"Answer","text":"У мастера с авито нет ИП, договора с пеней 1 % в день, гарантии 15 лет, сертификатов МЧС, ссылки на поставщика. У него нет пушки Bosch с термоконтролем и склада с полотном MSD Multipass. Через год, когда полотно провиснет, его телефон будет недоступен. Мы — 12 лет, договор, акт приёмки, звонок через 12 месяцев."}}
  ]
}
