# ============================================================================
# nginx — BASH-Site 2026 production server block
# Полная конфигурация с security headers, nonce-based CSP, TLS 1.3, OCSP
# Разместить: /etc/nginx/sites-available/bash-site.conf
# Активировать: ln -s /etc/nginx/sites-available/bash-site.conf /etc/nginx/sites-enabled/
# Проверка: nginx -t && systemctl reload nginx
# ============================================================================

# --- Лимиты (защита от brute-force / DDoS на форму) ---
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Upstream к PHP-FPM (если используется локальный PHP) ---
upstream php_backend {
    server unix:/run/php/php8.2-fpm.sock;
    # или server 127.0.0.1:9000;
}

# --- HTTP → HTTPS редирект (80 порт) ---
server {
    listen 80;
    listen [::]:80;
    server_name bash-site.ru www.bash-site.ru;

    # ACME-challenge для Let's Encrypt (до редиректа!)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS основной сервер (TLS 1.3 / 1.2) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bash-site.ru www.bash-site.ru;

    root /var/www/bash-site/public;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- TLS сертификаты ---
    ssl_certificate     /etc/letsencrypt/live/bash-site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bash-site.ru/privkey.pem;

    # --- TLS 1.3 + 1.2 (минимум), запрет legacy ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- OCSP stapling ---
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- Запрет скрытых файлов ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- PHP только в /api/ ---
    location ~ \.php$ {
        deny all;
    }

    location = /api/lead {
        limit_req zone=lead_limit burst=3 nodelay;
        limit_conn conn_limit 5;
        rewrite ^/api/lead$ /api/lead.php last;
    }
    location ^~ /api/ {
        limit_req zone=lead_limit burst=3 nodelay;
        limit_conn conn_limit 5;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php_backend;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30s;
            fastcgi_hide_header X-Powered-By;
        }
    }

    location = /.well-known/security.txt {
        default_type text/plain;
    }

    location = /robots.txt { default_type text/plain; }
    location = /sitemap.xml { default_type application/xml; }

    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 405;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
